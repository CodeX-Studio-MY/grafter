repos:                    # one entry per repo of the solution (fictional example)
  - name: api             # short id: lowercase, digits, - and _; used by the charter's `repos:`
    github: your-org/your-api
    default_branch: main
    language: dotnet      # free text: dotnet, node, flutter, python, ...
    test_command: dotnet test
    coverage_command: dotnet test --collect:"XPlat Code Coverage"
    test_paths:           # globs; a `test` change may touch only these
      - tests/**
      - "**/*.Tests/**"
    sandbox_image: mcr.microsoft.com/dotnet/sdk:8.0   # empty = engine default
  - name: web
    github: your-org/your-web
    language: node
    test_command: npm test
    coverage_command: npm run test:coverage
    test_paths:
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/__tests__/**"
    sandbox_image: node:20
  - name: mobile
    github: your-org/your-mobile
    language: flutter
    test_command: flutter test
    coverage_command: flutter test --coverage
    test_paths:
      - test/**
      - integration_test/**
branches:
  production: main
  preview: ai/preview
  fix_prefix: ai/
limits:
  max_prs_per_night: 3
  token_budget_per_night: 500000
  usd_budget_per_night: 5.0   # hard cap, enforced on the LiteLLM virtual key
engine: openhands
tier0_auto_merge: false   # opt-in
llm_gateway_url: http://localhost:4000
models:                   # LiteLLM model name per role, routed via the gateway (D15)
  planner: claude-opus-5-5    # find work, plan the change
  coder: claude-sonnet-5-5    # write code and tests
  reviewer: claude-opus-5-5   # review the diff
  judge: claude-opus-5-5      # charter alignment
dry_run: false            # true = do everything except push branches / open PRs
kill_switch:              # run stops if the file exists or the env var is 1/true/yes/on
  file: ~/.grafter/STOP
  env: GRAFTER_STOP
nightly_focus:            # rotates one per night: test, security, performance, bugfix, ...
  - test
github_app:               # ids only; the private key comes from an env var, never this file
  app_id: null
  installation_id: null
