# Model routes for Grafter roles (D15). Names match `models:` in grafter.yaml.
model_list:
  - model_name: claude-opus-5-5          # planner, reviewer, judge
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-5-5        # coder
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # admin only; never given to sandboxes
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
