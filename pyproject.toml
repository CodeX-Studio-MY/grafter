[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grafter"
version = "0.0.1"
description = "Continuous AI that grafts only what you approve."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "CodeX Studio" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
openhands = ["openhands-sdk"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7", "mypy>=1.11", "types-PyYAML", "pytest-cov>=5"]

[project.scripts]
grafter = "grafter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/grafter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=grafter --cov-report=term-missing"

[tool.coverage.run]
source = ["grafter"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
