[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grafter"
version = "0.0.1"
description = "Continuous AI that grafts only what you approve."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "CodeX Studio" }]
dependencies = [
  "PyJWT[crypto]>=2.8",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
openhands = [  # pinned together; must match the agent-server image (spikes/openhands_hello.py)
  "openhands-sdk==1.60.1",
  "openhands-tools==1.60.1",
  "openhands-workspace==1.60.1",
  "openhands-agent-server==1.60.1",
]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7", "mypy>=1.11", "types-PyYAML", "pytest-cov>=5"]

[project.scripts]
grafter = "grafter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/grafter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["grafter", "acme_harvest"]  # acme_harvest: examples/sandbox-repo

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openhands.*"]  # optional extra; not installed in the dev venv
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=grafter --cov-report=term-missing"

[tool.coverage.run]
source = ["grafter"]
branch = true
# Real OpenHands adapter: needs Docker + the gateway; exercised by spikes/engine_try.py.
omit = ["*/grafter/engines/openhands_sdk.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
